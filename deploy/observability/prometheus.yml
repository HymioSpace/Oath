global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: host
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: oath
    static_configs:
      - targets:
          - storage:8770
          - queue:8771
          - manager:8772
          - tools:8773
          - gateway:8765
          - biz:8766
          - worker:8780
          - consumer:8780
          - supervisor:8780
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: hymio
    static_configs:
      - targets: ["host.docker.internal:8080"]
