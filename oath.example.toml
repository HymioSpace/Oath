# Oath 配置。复制成 oath.toml 后按需改。
#
# **凭证只写环境变量名**：`api_key_env` 是变量名，不是值。配置文件会进 git，
# 把 key 写在这里等于公开它。

data_root = "./data"

# 服务级凭证：能调 create_session / list_sessions 的那些。**不含任何 session 的凭证**
# —— session token 由 manager 签发，只进那一个 scope 的 agent 进程。
service_credentials = ["${OATH_SERVICE_TOKEN}"]

# 中间件。**队列与 buffer 的具体实现由这两项决定** —— 换中间件就是重写一套
# EventQueue / EventBuffer 实现，core 不感知。
[middleware]
# 队列：Redis Streams。三条队列（user / tool / system）的 key 都带 scope。
redis_url = "redis://127.0.0.1:6379/0"
# 单次队列操作的超时。取不到就是取不到，不阻塞到天荒地老。
redis_timeout_seconds = 5.0

# buffer 用 diskcache（SQLite），落 data_root/<user_id>/<session_id>/buffer 下，
# 重启能接着读，所以上面这一项不需要单独配路径。

# scope 的增删。每个 session 一对进程：一个 agent、一个 supervisor。
[manager]
# 同时存在多少个 scope。满了 create_session 直接报失败，不排队。
max_sessions = 64
# 分配给 agent 进程的端口区间。闭区间，撞上就换一个。
port_range_start = 8800
port_range_end = 8899
# 多久探一次每个 agent 的连接数。
reap_interval_seconds = 5.0
# 连接数连续为 0 多久之后回收这个 scope。给重连留一段冷却。
idle_grace_seconds = 60.0

[server]
host = "127.0.0.1"
# biz server 的端口。整个 biz 一个端口，每条能力是其中一个 path（/create_session、
# /list_traces、/query_trace、/cli/<命令名>）。与 WebSocket 分开：查询不是 command，
# 不占会话连接。
http_port = 8766
# 每条连接的发送队列长度。满了就断开那条连接，不拖住 core。
send_queue_size = 256
# 一个 scope 的 agent 同时接受多少条连接。
max_connections = 32
# 一条连接多久没有任何 command 就断开。
idle_timeout_seconds = 300.0

[agent]
system_prompt = """
你是一个通过终端对话的助手。回答尽量简洁；需要外部信息时调用工具，不要凭空编。
"""
max_output_tokens = 2048
temperature = 0.7

# 扩展目录。每个目录下按同一套规则扫 tools/、cli/、skills/，顺序即优先级。
# extensions-local/ 不进版本库 —— 把自己的工具、命令和技能放在那里，agent 照常
# 扫到，不用改任何代码。目录不存在不是错误；配成 [] 就是彻底关掉扩展扫描。
extension_dirs = ["./extensions", "./extensions-local"]

# 项目自己的技能目录。每个技能是里面的一个子目录，含 SKILL.md（YAML frontmatter
# 加 markdown 正文）。frontmatter 里的 priority 越大越晚被丢掉；没写的按 0 算。
# 各扩展目录下的 skills/ 也进索引，排在这个目录之后。
skill_dir = "./extensions/skills"
# 技能索引进 system prompt 的 token 预算。装不下就按优先级丢，丢掉的仍然能被
# skill 工具搜到。
skill_index_tokens = 1024
# 额外扫的技能目录。配置里的排在 ~/.claude/skills、~/.codex/skills 等已装好的
# coding agent 技能目录之后 —— 同名时先到先赢。
skill_scan_dirs = []

# bash 工具的默认工作目录，也就是 system prompt 里那段工作区说明说的地方。
# 命令默认在它下面跑；模型要访问别处就给 bash 传 cwd，不受这里限制。
workspace_root = "./workspace"
# oath-cli 所在的目录，执行命令时前置到 PATH 上 —— bash 里能直接 `oath-cli echo ...`。
# 与 workspace_root 一样在装配期解析成绝对路径，相对路径按 biz 进程的 cwd 算，
# 不是按命令的 cwd（命令默认在 workspace 下）。
cli_bin_dir = "./scripts"

[agent.provider]
model = "gpt-4o-mini"
api_base = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 60

# 每个 scope 的 supervisor：看住自己的 agent，定时往 system 队列投一次强制唤醒。
[supervisor]
# 存活探测的间隔与单次上限。**timeout 必须短于 interval** —— 慢检查不能连着慢两轮。
heartbeat_interval_seconds = 5.0
heartbeat_timeout_seconds = 3.0
heartbeat_failures_before_restart = 3
# 多久投一次 system.invoke。强制唤醒：让 idle 的模型再看一眼攒着的输入与工具结果，
# 投递本身不进 buffer。
invoke_interval_seconds = 30.0
# 连续启动失败后的重启退避，按失败次数翻倍，到 cap 封顶。
restart_backoff_seconds = 1.0
restart_backoff_cap_seconds = 60.0
# 请求一个进程退出后等多久，超过了就终止它。
shutdown_timeout_seconds = 5.0
